<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" role="img" aria-label="Dory">
  <!--
    Single-color Dory silhouette for the VS Code Activity Bar and the
    custom $(dory) icon font. VS Code masks the SVG with the active
    theme color, so the design is one filled shape with the eye cut out
    via fill-rule="evenodd". Sized to roughly fill the 24x24 box so the
    icon reads at codicon scale when used in the status bar.

    NOTE: keep this path in sync with DORY_PATH in
    scripts/build-icon-font.py.
  -->
  <path fill="currentColor" fill-rule="evenodd" d="
    M1 12
    C3 3.5 13 2.5 17 12
    C13 21.5 3 20.5 1 12 Z
    M17 12 L23.2 4.6
    C21.1 9 21.1 15 23.2 19.4 Z
    M4.6 10.2
    a1.1 1.1 0 1 0 2.2 0
    a1.1 1.1 0 1 0 -2.2 0 Z
  "/>
</svg>
